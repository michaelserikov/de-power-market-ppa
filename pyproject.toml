[project]
name = "deppa"
version = "0.6.0"
description = "German day-ahead power market: merit-order price model, capture prices, PPA valuation, market risk, model validation and battery arbitrage from SMARD data"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "duckdb>=1.1",
    "matplotlib>=3.9",
    "requests>=2.31",
    "pyarrow>=15",
    "scipy>=1.13",
    "openpyxl>=3.1",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
