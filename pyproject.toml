[project]
name = "deppa"
version = "0.1.0"
description = "German day-ahead power market: capture prices and PPA valuation from SMARD data"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "duckdb>=1.1",
    "matplotlib>=3.9",
    "requests>=2.31",
    "pyarrow>=15",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
